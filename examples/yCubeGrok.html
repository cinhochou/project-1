<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yCubeGrok</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three'
      import * as Y from 'yjs'
      import { WebrtcProvider } from 'y-webrtc'

      // Initialize Yjs document and WebRTC provider
      const ydoc = new Y.Doc()
      const roomName = 'synchronized-cube-room' // Shared room for synchronization
      const yprovider = new WebrtcProvider(roomName, ydoc, {
        signaling: ['ws://localhost:4444'],
      })
      const ymap = ydoc.getMap('cubeState')

      // Initialize Three.js scene
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x222222)

      // Fixed camera setup (orthographic for simplicity, positioned to view the cube)
      const camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 100)
      camera.position.set(5, 5, 5)
      camera.lookAt(0, 0, 0)

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(window.innerWidth, window.innerHeight)
      document.body.appendChild(renderer.domElement)

      // Create cube
      const geometry = new THREE.BoxGeometry(2, 2, 2)
      const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true })
      const cube = new THREE.Mesh(geometry, material)
      scene.add(cube)

      // Initialize cube state if not present
      if (!ymap.get('rotationX')) ymap.set('rotationX', 0)
      if (!ymap.get('rotationY')) ymap.set('rotationY', 0)
      if (!ymap.get('scale')) ymap.set('scale', 1)

      // Update cube from Yjs state
      function updateCube() {
        cube.rotation.x = ymap.get('rotationX')
        cube.rotation.y = ymap.get('rotationY')
        cube.scale.setScalar(ymap.get('scale'))
      }

      // Listen for changes in Yjs map
      ymap.observe(() => {
        updateCube()
      })

      // Initial update
      updateCube()

      // Mouse interaction for rotation (drag to rotate)
      let isDragging = false
      let previousMouseX = 0
      let previousMouseY = 0

      renderer.domElement.addEventListener('mousedown', (event) => {
        isDragging = true
        previousMouseX = event.clientX
        previousMouseY = event.clientY
      })

      renderer.domElement.addEventListener('mousemove', (event) => {
        if (isDragging) {
          const deltaX = event.clientX - previousMouseX
          const deltaY = event.clientY - previousMouseY
          ymap.set('rotationY', ymap.get('rotationY') + deltaX * 0.01)
          ymap.set('rotationX', ymap.get('rotationX') + deltaY * 0.01)
          previousMouseX = event.clientX
          previousMouseY = event.clientY
        }
      })

      renderer.domElement.addEventListener('mouseup', () => {
        isDragging = false
      })

      // Wheel event for scaling
      renderer.domElement.addEventListener('wheel', (event) => {
        event.preventDefault()
        const scaleDelta = event.deltaY > 0 ? -0.1 : 0.1
        const newScale = Math.max(0.1, Math.min(5, ymap.get('scale') + scaleDelta))
        ymap.set('scale', newScale)
      })

      // Handle window resize
      window.addEventListener('resize', () => {
        camera.left = (-window.innerWidth / window.innerHeight) * 5
        camera.right = (window.innerWidth / window.innerHeight) * 5
        camera.top = 5
        camera.bottom = -5
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      // Animation loop
      function animate() {
        requestAnimationFrame(animate)
        renderer.render(scene, camera)
      }
      animate()
    </script>
  </body>
</html>
